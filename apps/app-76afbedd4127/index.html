<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英単語アドベンチャー</title>
<style>
  /* 全体のスタイル（黄色は一切使用せず、青・赤・緑・紫・白・茶色系で構成） */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Meiryo", sans-serif;
    background-color: #5C94FC; /* レトロゲーム風の空色 */
    color: #1A1A1A;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ふりがなの調整 */
  ruby {
    ruby-align: center;
  }
  rt {
    font-size: 0.5em;
    color: #333333;
  }

  /* メインコンテナ */
  .container {
    flex: 1;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* 画面カード */
  .card {
    background-color: #FFFFFF;
    border: 6px solid #222222;
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 8px 0 #1A4B9C;
    text-align: center;
    margin-bottom: 16px;
  }

  /* タイトル */
  h1 {
    font-size: 2.3rem;
    margin: 0 0 16px 0;
    color: #E52521; /* 赤色 */
    text-shadow: 2px 2px 0 #222222;
    letter-spacing: 2px;
  }

  .subtitle {
    font-size: 1.35rem;
    font-weight: bold;
    margin-bottom: 24px;
    color: #222222;
  }

  /* 大きなボタン共通スタイル */
  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: bold;
    padding: 18px 28px;
    border: 4px solid #222222;
    border-radius: 18px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    color: #FFFFFF;
    text-decoration: none;
    margin: 8px;
  }

  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #222222 !important;
  }

  /* ボタンの色バリエーション（黄色なし） */
  .btn-red {
    background-color: #E52521;
    box-shadow: 0 6px 0 #8B110E;
  }

  .btn-green {
    background-color: #43B047;
    box-shadow: 0 6px 0 #226625;
  }

  .btn-blue {
    background-color: #0066CC;
    box-shadow: 0 6px 0 #003D7A;
  }

  .btn-purple {
    background-color: #8E44AD;
    box-shadow: 0 6px 0 #5B2C6F;
  }

  .btn-gray {
    background-color: #666666;
    box-shadow: 0 6px 0 #333333;
  }

  /* テーマ選択グリッド */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 16px;
  }

  @media (max-width: 560px) {
    .theme-grid {
      grid-template-columns: 1fr;
    }
  }

  .theme-btn {
    width: 100%;
    margin: 0;
    padding: 24px 16px;
    font-size: 1.6rem;
    opacity: 0.9;
  }

  .theme-btn.selected {
    outline: 6px solid #1A1A1A;
    transform: translateY(-2px);
    opacity: 1;
  }

  /* クイズ画面の要素 */
  .progress-bar {
    font-size: 1.3rem;
    font-weight: bold;
    background-color: #E6F0FF;
    border: 3px solid #0066CC;
    border-radius: 12px;
    padding: 8px 16px;
    display: inline-block;
    color: #004499;
  }

  .question-word {
    font-size: 2.8rem;
    font-weight: bold;
    margin: 16px 0 24px 0;
    color: #1A1A1A;
    background-color: #F2F7FF;
    padding: 24px;
    border-radius: 16px;
    border: 4px dashed #5C94FC;
  }

  /* 3つの選択肢ボタン */
  .choices-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 16px;
  }

  .choice-btn {
    width: 100%;
    margin: 0;
    padding: 22px;
    font-size: 2.1rem;
    background-color: #FFFFFF;
    color: #1A1A1A;
    border: 5px solid #222222;
    box-shadow: 0 6px 0 #222222;
  }

  .choice-btn:active {
    background-color: #E6F0FF;
  }

  /* 正解をタップした時だけ緑色にする */
  .choice-btn.correct {
    background-color: #43B047;
    color: #FFFFFF;
    border-color: #1A4D1C;
    box-shadow: 0 6px 0 #1A4D1C;
  }

  .choice-btn:disabled {
    cursor: default;
  }

  /* 結果フィードバックエリア */
  .feedback-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 16px;
    border: 4px solid #222222;
    background-color: #F8F9FA;
    display: none;
  }

  .feedback-title {
    font-size: 1.8rem;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .feedback-answer {
    font-size: 1.7rem;
    font-weight: bold;
    color: #0066CC;
    margin-bottom: 16px;
  }

  /* 地面の装飾（レンガ風・茶色と黒） */
  .ground {
    height: 36px;
    background-color: #C84C0C;
    border-top: 5px solid #222222;
    background-image: linear-gradient(90deg, transparent 95%, #222222 95%),
                      linear-gradient(0deg, transparent 90%, #222222 90%);
    background-size: 48px 18px;
  }

  /* 画面の切り替え用 */
  .screen {
    display: none;
  }
  .screen.active {
    display: block;
  }

  /* スコア表示 */
  .score-text {
    font-size: 2.6rem;
    font-weight: bold;
    color: #E52521;
    margin: 20px 0;
  }
</style>
</head>
<body>

<div class="container">
  <!-- ① スタート画面（テーマ選択） -->
  <div id="screen-start" class="card screen active">
    <h1><ruby>英単語<rt>えいたんご</rt></ruby>アドベンチャー</h1>
    <p class="subtitle" id="start-guide">
      <ruby>練習<rt>れんしゅう</rt></ruby>したいテーマを<ruby>選<rt>えら</rt></ruby>んで「はじめる」を<ruby>押<rt>お</rt></ruby>してね！
    </p>

    <div class="theme-grid">
      <button id="theme-colors" class="btn btn-red theme-btn" onclick="selectTheme('colors')">
        <ruby>色<rt>いろ</rt></ruby>（Colors）
      </button>
      <button id="theme-animals" class="btn btn-green theme-btn" onclick="selectTheme('animals')">
        <ruby>動物<rt>どうぶつ</rt></ruby>（Animals）
      </button>
      <button id="theme-food" class="btn btn-blue theme-btn" onclick="selectTheme('food')">
        <ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>（Food）
      </button>
      <button id="theme-random" class="btn btn-purple theme-btn" onclick="selectTheme('random')">
        ランダム（Random）
      </button>
    </div>

    <div style="margin-top: 28px;">
      <button id="btn-start-game" class="btn btn-red" style="font-size: 1.9rem; padding: 20px 56px; opacity: 0.5;" onclick="startGame()" disabled>
        はじめる
      </button>
    </div>
  </div>

  <!-- ② クイズ画面 -->
  <div id="screen-quiz" class="card screen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div class="progress-bar" id="progress-text">
        <ruby>第<rt>だい</rt></ruby> 1 <ruby>問<rt>もん</rt></ruby> / 5 <ruby>問<rt>もん</rt></ruby>
      </div>
      <button class="btn btn-gray" style="font-size: 1.1rem; padding: 10px 18px; margin: 0;" onclick="endGame()">
        おわり
      </button>
    </div>

    <div class="question-word" id="question-display">
      りんご
    </div>

    <div class="choices-container" id="choices-box">
      <!-- 選択肢ボタンがここに入ります -->
    </div>

    <!-- 回答後のフィードバック表示 -->
    <div id="feedback-area" class="feedback-box">
      <div id="feedback-title" class="feedback-title"></div>
      <div id="feedback-answer" class="feedback-answer"></div>
      <button class="btn btn-blue" onclick="speakCurrentAnswer()" style="font-size: 1.3rem; padding: 14px 24px;">
        もう<ruby>一度<rt>いちど</rt></ruby><ruby>発音<rt>はつおん</rt></ruby>を<ruby>聞<rt>き</rt></ruby>く
      </button>
      <button id="btn-next" class="btn btn-green" onclick="nextQuestion()" style="font-size: 1.4rem; padding: 14px 32px;">
        <ruby>次<rt>つぎ</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby>へ
      </button>
    </div>
  </div>

  <!-- ③ 結果・終了画面 -->
  <div id="screen-result" class="card screen">
    <h1><ruby>結果発表<rt>けっかはっぴょう</rt></ruby>！</h1>
    <div class="score-text" id="final-score">
      5 <ruby>問中<rt>もんちゅう</rt></ruby> 5 <ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！
    </div>
    <p class="subtitle" id="result-comment">
      すごい！パーフェクトだね！
    </p>
    <div style="margin-top: 24px;">
      <button class="btn btn-green" onclick="restartSameTheme()">
        もう<ruby>一度<rt>いちど</rt></ruby><ruby>遊<rt>あそ</rt></ruby>ぶ
      </button>
      <button class="btn btn-blue" onclick="goToTitle()">
        テーマを<ruby>選<rt>えら</rt></ruby>びなおす
      </button>
    </div>
  </div>
</div>

<!-- 地面の装飾 -->
<div class="ground"></div>

<script>
  // 問題データベース（ふりがなHTML付き）
  const quizData = {
    colors: [
      { jp: "<ruby>赤<rt>あか</rt></ruby>", en: "red", choices: ["red", "blue", "green"] },
      { jp: "<ruby>青<rt>あお</rt></ruby>", en: "blue", choices: ["black", "blue", "white"] },
      { jp: "<ruby>緑<rt>みどり</rt></ruby>", en: "green", choices: ["pink", "orange", "green"] },
      { jp: "<ruby>白<rt>しろ</rt></ruby>", en: "white", choices: ["white", "brown", "purple"] },
      { jp: "<ruby>黒<rt>くろ</rt></ruby>", en: "black", choices: ["gray", "black", "red"] },
      { jp: "<ruby>桃色<rt>ももいろ</rt></ruby>（ピンク）", en: "pink", choices: ["pink", "blue", "brown"] },
      { jp: "<ruby>茶色<rt>ちゃいろ</rt></ruby>", en: "brown", choices: ["white", "green", "brown"] }
    ],
    animals: [
      { jp: "<ruby>犬<rt>いぬ</rt></ruby>", en: "dog", choices: ["dog", "cat", "bird"] },
      { jp: "<ruby>猫<rt>ねこ</rt></ruby>", en: "cat", choices: ["fish", "cat", "bear"] },
      { jp: "<ruby>鳥<rt>とり</rt></ruby>", en: "bird", choices: ["rabbit", "pig", "bird"] },
      { jp: "<ruby>魚<rt>さかな</rt></ruby>", en: "fish", choices: ["fish", "lion", "monkey"] },
      { jp: "ウサギ", en: "rabbit", choices: ["elephant", "rabbit", "dog"] },
      { jp: "<ruby>熊<rt>くま</rt></ruby>", en: "bear", choices: ["bear", "cat", "frog"] },
      { jp: "<ruby>猿<rt>さる</rt></ruby>", en: "monkey", choices: ["tiger", "monkey", "cow"] }
    ],
    food: [
      { jp: "りんご", en: "apple", choices: ["apple", "banana", "orange"] },
      { jp: "バナナ", en: "banana", choices: ["grape", "banana", "melon"] },
      { jp: "みかん（オレンジ）", en: "orange", choices: ["peach", "lemon", "orange"] },
      { jp: "<ruby>牛乳<rt>ぎゅうにゅう</rt></ruby>", en: "milk", choices: ["milk", "water", "juice"] },
      { jp: "パン", en: "bread", choices: ["rice", "bread", "egg"] },
      { jp: "<ruby>卵<rt>たまご</rt></ruby>", en: "egg", choices: ["egg", "meat", "cake"] },
      { jp: "<ruby>水<rt>みず</rt></ruby>", en: "water", choices: ["tea", "water", "soup"] }
    ]
  };

  // 状態管理変数
  let selectedTheme = null;
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let currentCorrectWord = "";
  let isAnswered = false;

  // 音声読み上げ機能（iPad Safari対応）
  function speakEnglish(text) {
    if (!('speechSynthesis' in window)) {
      return;
    }
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    utterance.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.includes('en-US') && v.localService) ||
                    voices.find(v => v.lang.includes('en'));
    if (enVoice) {
      utterance.voice = enVoice;
    }

    window.speechSynthesis.speak(utterance);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      window.speechSynthesis.getVoices();
    };
  }

  // テーマ選択時の処理
  function selectTheme(theme) {
    selectedTheme = theme;

    // 選択枠の更新
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById('theme-' + theme).classList.add('selected');

    const themeNames = {
      colors: "<ruby>色<rt>いろ</rt></ruby>",
      animals: "<ruby>動物<rt>どうぶつ</rt></ruby>",
      food: "<ruby>食<rt>た</rt></ruby>べ<ruby>物<rt>もの</rt></ruby>",
      random: "ランダム"
    };

    document.getElementById('start-guide').innerHTML =
      `「${themeNames[theme]}」を<ruby>選<rt>えら</rt></ruby>んだね！「はじめる」を<ruby>押<rt>お</rt></ruby>そう！`;

    const startBtn = document.getElementById('btn-start-game');
    startBtn.disabled = false;
    startBtn.style.opacity = "1";
  }

  // 画面切り替え関数
  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // 配列をシャッフルする関数
  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ゲーム開始（ユーザー操作をトリガーに音声を初期化）
  function startGame() {
    if (!selectedTheme) return;

    if ('speechSynthesis' in window) {
      const initUtterance = new SpeechSynthesisUtterance("");
      initUtterance.volume = 0;
      window.speechSynthesis.speak(initUtterance);
    }

    // テーマに応じた問題プールを作成
    let pool = [];
    if (selectedTheme === 'random') {
      pool = [
        ...quizData.colors,
        ...quizData.animals,
        ...quizData.food
      ];
    } else {
      pool = quizData[selectedTheme];
    }

    // ランダムに5問抽出
    currentQuestions = shuffleArray(pool).slice(0, 5);
    currentIndex = 0;
    score = 0;

    showScreen('screen-quiz');
    loadQuestion();
  }

  // 問題の表示
  function loadQuestion() {
    isAnswered = false;
    const q = currentQuestions[currentIndex];
    currentCorrectWord = q.en;

    document.getElementById('progress-text').innerHTML =
      `<ruby>第<rt>だい</rt></ruby> ${currentIndex + 1} <ruby>問<rt>もん</rt></ruby> / 5 <ruby>問<rt>もん</rt></ruby>`;
    document.getElementById('question-display').innerHTML = q.jp;

    document.getElementById('feedback-area').style.display = 'none';

    const choicesBox = document.getElementById('choices-box');
    choicesBox.innerHTML = '';
    const shuffledChoices = shuffleArray(q.choices);

    shuffledChoices.forEach(choice => {
      const btn = document.createElement('button');
      btn.className = 'btn choice-btn';
      btn.textContent = choice;
      btn.onclick = () => checkAnswer(btn, choice);
      choicesBox.appendChild(btn);
    });
  }

  // 答え合わせ
  function checkAnswer(clickedBtn, selectedWord) {
    if (isAnswered) return;
    isAnswered = true;

    const allButtons = document.querySelectorAll('.choice-btn');
    allButtons.forEach(btn => btn.disabled = true);

    const feedbackArea = document.getElementById('feedback-area');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackAnswer = document.getElementById('feedback-answer');
    const nextBtn = document.getElementById('btn-next');

    if (selectedWord === currentCorrectWord) {
      // 正解のとき：タップしたボタンを緑色にして発音
      score++;
      clickedBtn.classList.add('correct');
      feedbackTitle.innerHTML = `⭕ <ruby>大正解<rt>だいせいかい</rt></ruby>！`;
      feedbackTitle.style.color = "#226625";
      feedbackAnswer.innerHTML = `<ruby>発音<rt>はつおん</rt></ruby>： <strong>${currentCorrectWord}</strong>`;

      speakEnglish(currentCorrectWord);
    } else {
      // まちがえたとき：どのボタンにも色をつけず、正しい答えと発音を表示・再生
      feedbackTitle.innerHTML = `❌ ざんねん！`;
      feedbackTitle.style.color = "#E52521";
      feedbackAnswer.innerHTML = `<ruby>正<rt>ただ</rt></ruby>しい<ruby>答<rt>こた</rt></ruby>え： <strong>${currentCorrectWord}</strong>`;

      speakEnglish(currentCorrectWord);
    }

    if (currentIndex === 4) {
      nextBtn.innerHTML = `<ruby>結果<rt>けっか</rt></ruby>を<ruby>見<rt>み</rt></ruby>る`;
    } else {
      nextBtn.innerHTML = `<ruby>次<rt>つぎ</rt></ruby>の<ruby>問題<rt>もんだい</rt></ruby>へ`;
    }

    feedbackArea.style.display = 'block';
  }

  // 発音をもう一度聞くボタン
  function speakCurrentAnswer() {
    speakEnglish(currentCorrectWord);
  }

  // 次の問題へ進む
  function nextQuestion() {
    currentIndex++;
    if (currentIndex < 5) {
      loadQuestion();
    } else {
      showResult();
    }
  }

  // 結果画面の表示
  function showResult() {
    showScreen('screen-result');
    document.getElementById('final-score').innerHTML =
      `5 <ruby>問中<rt>もんちゅう</rt></ruby> ${score} <ruby>問<rt>もん</rt></ruby><ruby>正解<rt>せいかい</rt></ruby>！`;

    let comment = "";
    if (score === 5) {
      comment = "すごい！全問正解（ぜんもんせいかい）！マスターだね！";
    } else if (score >= 3) {
      comment = "よくがんばったね！あと少（すこ）しで満点（まんてん）だ！";
    } else {
      comment = "おつかれさま！もう一回（いっかい）練習（れんしゅう）してみよう！";
    }
    document.getElementById('result-comment').textContent = comment;
  }

  // 途中で「おわり」を押したとき
  function endGame() {
    window.speechSynthesis.cancel();
    goToTitle();
  }

  // 同じテーマでもう一度遊ぶ
  function restartSameTheme() {
    startGame();
  }

  // 最初の画面に戻る
  function goToTitle() {
    selectedTheme = null;
    document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('selected'));
    const startBtn = document.getElementById('btn-start-game');
    startBtn.disabled = true;
    startBtn.style.opacity = "0.5";
    document.getElementById('start-guide').innerHTML =
      `<ruby>練習<rt>れんしゅう</rt></ruby>したいテーマを<ruby>選<rt>えら</rt></ruby>んで「はじめる」を<ruby>押<rt>お</rt></ruby>してね！`;
    showScreen('screen-start');
  }
</script>
</body>
</html>
